tracker_type: botsort
# iter 3 tried loosening these (0.30 / 0.35) and made things worse on every metric.
# Strict thresholds are what give BoT-SORT its identity edge.
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 90              # 3s @ 30fps; survives transition occlusions
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.5        # similar uniforms rarely clear 0.8
with_reid: True
model: auto                   # "auto" reuses YOLO backbone features (no extra weights)
